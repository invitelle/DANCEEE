.magic-cta:hover {

.magic-sparkle {
  position: absolute;

.magic-sparkle.one {

.magic-sparkle.three {

.magic-butterfly {

@keyframes fadeIn {

  to {opacity:1}
}

@keyframes riseIn {

  to {opacity:1;transform:translateY(0)}
}

@keyframes boom {
