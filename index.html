
<section id="angel-wings-ad">
  <video
    autoplay
    muted
    loop
    playsinline
    webkit-playsinline
    preload="auto"
  >
    <source
      src="https://cdn.shopify.com/videos/c/o/v/4a988ce0ab5a45bf8d4d78ac22549e88.mov"
      type="video/quicktime"
    >
  </video>

  <div class="angel-wings-shade"></div>

  <div class="angel-wings-text">
    <div class="angel-wings-heading">
      ՀՐԵՇՏԱԿԻ ԹԵՎԵՐ
    </div>

    <div class="angel-wings-gift">
      ՆՎԵՐ՝ ԼՈՒՍԱՅԻՆ ԹԻԹԵՌ
    </div>

    <div class="angel-wings-offer">
      <span>ԱԿՑԻԱ</span>
      <strong>55,000 ֏</strong>
    </div>
  </div>
</section>

<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+Armenian:wght@500;600;700;800&display=swap');

#angel-wings-ad {
  position: relative;
  width: 100%;
  height: min(720px, 75vw);
  min-height: 420px;
  overflow: hidden;
  background: #17101b;
  isolation: isolate;
  font-family: 'Noto Serif Armenian', serif;
}

#angel-wings-ad video {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  z-index: -2;
}

#angel-wings-ad .angel-wings-shade {
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(
    90deg,
    rgba(15, 8, 20, 0.62) 0%,
    rgba(15, 8, 20, 0.24) 35%,
    transparent 70%
  );
}

#angel-wings-ad .angel-wings-text {
  position: absolute;
  left: 6%;
  top: 50%;
  transform: translateY(-50%);
  max-width: 470px;
  padding: 22px 25px;
  color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,.65);
}

#angel-wings-ad .angel-wings-heading {
  font-size: clamp(25px, 3.5vw, 43px);
  font-weight: 800;
  line-height: 1.35;
  letter-spacing: 1px;
  margin-bottom: 18px;
}

#angel-wings-ad .angel-wings-gift {
  font-size: clamp(17px, 2vw, 23px);
  font-weight: 700;
  color: #ffe5a5;
  margin-bottom: 23px;
}

#angel-wings-ad .angel-wings-offer {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 13px;
}

#angel-wings-ad .angel-wings-offer span {
  background: #b92e55;
  color: #fff;
  padding: 8px 15px;
  font-size: 18px;
  font-weight: 800;
  letter-spacing: 1px;
}

#angel-wings-ad .angel-wings-offer strong {
  color: #ffe6a2;
  font-size: clamp(34px, 5vw, 54px);
  font-weight: 800;
  line-height: 1.2;
}

@media (max-width: 600px) {
  #angel-wings-ad {
    height: 570px;
    min-height: 0;
  }

  #angel-wings-ad video {
    object-position: center;
  }

  #angel-wings-ad .angel-wings-shade {
    background: linear-gradient(
      0deg,
      rgba(12, 7, 18, .76) 0%,
      rgba(12, 7, 18, .22) 48%,
      transparent 78%
    );
  }

  #angel-wings-ad .angel-wings-text {
    top: auto;
    bottom: 28px;
    left: 0;
    right: 0;
    transform: none;
    max-width: 100%;
    padding: 18px 15px;
    text-align: center;
  }

  #angel-wings-ad .angel-wings-heading {
    font-size: 27px;
    margin-bottom: 10px;
  }

  #angel-wings-ad .angel-wings-gift {
    font-size: 17px;
    margin-bottom: 15px;
  }

  #angel-wings-ad .angel-wings-offer {
    justify-content: center;
    gap: 10px;
  }

  #angel-wings-ad .angel-wings-offer span {
    font-size: 15px;
    padding: 7px 12px;
  }

  #angel-wings-ad .angel-wings-offer strong {
    font-size: 37px;
  }
}
</style>

<script>
(function () {
  var section = document.getElementById('angel-wings-ad');
  if (!section) return;

  var video = section.querySelector('video');
  if (!video) return;

  video.muted = true;
  video.defaultMuted = true;

  var play = function () {
    var promise = video.play();
    if (promise && promise.catch) {
      promise.catch(function () {});
    }
  };

  play();

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) play();
  });
})();
</script>
